[package]
name = "android-jni"
description = "KD-Emulator native library for Android: JNI bridge, emulation thread, frame hand-off, AAudio output, SAF file-descriptor loading and Tensor thermal/affinity integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "kd_emulator"
crate-type = ["cdylib", "rlib"]

[dependencies]
kd-core.workspace = true
core-gba.workspace = true
core-nds.workspace = true
libc.workspace = true
tracing.workspace = true
jni = { version = "0.21", default-features = false }
