[package]
name = "gpu-gx-vk"
description = "GameCube/Wii GX graphics: FIFO parser, CP/XF/BP state, vertex and texture decoding, TEV-to-SPIR-V shader generation with PowerVR DXT / ARM Mali profiles, software reference renderer and Vulkan backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
kd-core.workspace = true
tracing.workspace = true
naga = { version = "25", features = ["glsl-in", "spv-out"] }
ash = { version = "0.38", default-features = false, features = ["loaded", "debug"] }
