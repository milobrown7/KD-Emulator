# Builds the Android APK and publishes it as a GitHub release.
#
# Runs when a version tag (v*) is pushed, or when a push changes the
# release notes, the app version or this workflow. The release tag is
# v<versionName> from android/app/build.gradle.kts; if that release already
# exists the run stops after the version check, so bump versionName for a
# new release.
#
# Signing: add the repository secrets KEYSTORE_BASE64 (base64 of a .jks),
# KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD to sign every release with
# the same key (so updates install over each other). Without them the APK
# is signed with a key generated for that run only.
name: Release APK

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - RELEASE_NOTES.md
      - android/app/build.gradle.kts
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.exists != 'true'
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.exists != 'true'

      - name: Install Android NDK r28 and cargo-ndk
        if: steps.version.outputs.exists != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.0.13004108" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          cargo install cargo-ndk --locked

      - name: Host tests
        if: steps.version.outputs.exists != 'true'
        run: cargo test --workspace

      - name: Signing key
        if: steps.version.outputs.exists != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: signing with a one-off key."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias kd -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass kdemulator -keypass kdemulator -dname "CN=KD-Emulator"
          fi

      - name: Build release APK
        if: steps.version.outputs.exists != 'true'
        working-directory: android
        env:
          KD_KEYSTORE: ${{ runner.temp }}/release.jks
          KD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'kdemulator' }}
          KD_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'kd' }}
          KD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'kdemulator' }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK (signature, 16 KB alignment)
        if: steps.version.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/zipalign" -c -P 16 4 "$APK"
          cp "$APK" "KD-Emulator-$TAG.apk"
          sha256sum "KD-Emulator-$TAG.apk" > "KD-Emulator-$TAG.apk.sha256"

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.exists != 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: KD-Emulator ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            KD-Emulator-*.apk
            KD-Emulator-*.apk.sha256
